name: Build Windows EXE

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build executable
        run: |
          pyinstaller --onefile --noconsole --name mac-changer --hidden-import mac_utils main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-changer-windows
          path: dist/mac-changer.exe

      - name: Create next tag if needed
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force
          new_tag=$(python scripts/next_version_tag.py)
          if [ -z "$new_tag" ]; then
            echo "Failed to compute the next version tag" >&2
            exit 1
          fi
          git tag "$new_tag"
          git push origin "$new_tag"
          echo "Created tag $new_tag"
          echo "tag=$new_tag" >> "$GITHUB_OUTPUT"
        id: tag

      - name: Ensure latest release tag exists
        if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          git tag -f latest
          git push origin latest --force

      - name: Create release
        if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/mac-changer.exe
          tag_name: latest
          name: Latest Release
          draft: false
          prerelease: false
          make_latest: true
