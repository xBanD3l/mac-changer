name: Build Windows EXE

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Create next tag if needed
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force
          latest_tag=$(git tag --list 'v*' | grep -E '^v[0-9]+(\.[0-9]+)*$' | sort -V | tail -n 1)
          if [ -z "$latest_tag" ]; then
            major=1
            minor=0
            patch=0
            new_tag="v1.0.0"
          else
            version=${latest_tag#v}
            IFS='.' read -r major minor patch <<< "${version}.0.0"
            patch=$((patch + 1))
            new_tag="v${major}.${minor}.${patch}"
          fi
          while git rev-parse -q --verify "refs/tags/${new_tag}" >/dev/null; do
            patch=$((patch + 1))
            new_tag="v${major}.${minor}.${patch}"
          done
          git tag "$new_tag"
          git push origin "$new_tag"
          echo "tag=$new_tag" >> "$GITHUB_OUTPUT"
        id: tag

      - name: Ensure latest release tag exists
        if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          git tag -f latest
          git push origin latest --force

      - name: Build executable
        run: |
          pyinstaller --onefile --noconsole --name mac-changer --hidden-import mac_utils main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-changer-windows
          path: dist/mac-changer.exe

      - name: Create release
        if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/mac-changer.exe
          tag_name: latest
          name: Latest Release
          draft: false
          prerelease: false
          make_latest: true
